# Project-wide Gradle settings.
org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m
org.gradle.parallel=true

# AndroidX
android.useAndroidX=true

# Use this property to specify which architecture you want to build.
reactNativeArchitectures=armeabi-v7a,arm64-v8a,x86,x86_64

# Use the new React Native architecture (Fabric + TurboModules). Off: this
# app's native modules (CellScannerModule, TrafficModule, BleScannerModule,
# OrientationModule) are plain bridge modules with no custom native C++, so
# the old architecture builds them fine without requiring the NDK/CMake.
newArchEnabled=false

# Use Hermes JS engine.
hermesEnabled=true
