# Builds the SignalTrace Android app bundle with Gradle. This is a mobile app,
# not a web service — do NOT use Cloud Build's "Buildpacks" deploy flow
# (Cloud Run / App Engine); there is nothing to run as a container here.
#
# Required substitutions/secrets for a signed release build (optional for a
# debug-signed build, which is fine for internal testing only):
#   RELEASE_STORE_FILE, RELEASE_STORE_PASSWORD, RELEASE_KEY_ALIAS,
#   RELEASE_KEY_PASSWORD, MAPS_API_KEY
#
# Trigger with e.g.:
#   gcloud builds submit --config cloudbuild.yaml \
#     --substitutions=_MAPS_API_KEY=$MAPS_API_KEY

steps:
  - name: "node:20"
    entrypoint: npm
    args: ["install"]
    dir: "SignalTrace"

  - name: "reactnativecommunity/react-native-android"
    entrypoint: bash
    args:
      - -c
      - |
        cd SignalTrace/android
        ./gradlew bundleRelease \
          -PMAPS_API_KEY="$_MAPS_API_KEY" \
          -PRELEASE_STORE_FILE="$_RELEASE_STORE_FILE" \
          -PRELEASE_STORE_PASSWORD="$_RELEASE_STORE_PASSWORD" \
          -PRELEASE_KEY_ALIAS="$_RELEASE_KEY_ALIAS" \
          -PRELEASE_KEY_PASSWORD="$_RELEASE_KEY_PASSWORD"

artifacts:
  objects:
    location: "gs://$PROJECT_ID-signaltrace-builds/"
    paths: ["SignalTrace/android/app/build/outputs/bundle/release/app-release.aab"]

substitutions:
  _MAPS_API_KEY: ""
  _RELEASE_STORE_FILE: ""
  _RELEASE_STORE_PASSWORD: ""
  _RELEASE_KEY_ALIAS: ""
  _RELEASE_KEY_PASSWORD: ""

options:
  logging: CLOUD_LOGGING_ONLY
